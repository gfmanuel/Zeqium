      Count: 2
      SANS:
        - localhost
    Users:
      Count: 1

  - Name: Hotel
    Domain: hotel.zeqium.com
    EnableNodeOUs: true
    Template:
      Count: 2
      SANS:
        - localhost
    Users:
      Count: 1
