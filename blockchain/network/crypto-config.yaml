    Specs:
      - Hostname: orderer0
        SANS: [localhost, orderer0.zeqium.com]
      - Hostname: orderer1
        SANS: [localhost, orderer1.zeqium.com]
      - Hostname: orderer2
        SANS: [localhost, orderer2.zeqium.com]

