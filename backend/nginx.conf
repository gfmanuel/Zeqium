events { worker_connections 1024; }

http {
    server {
        listen 80;

        # Redirección para la API de la Policía
        location /api/police/ {
            proxy_pass http://police-api:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Redirección para la API del Hotel
        location /api/hotel/ {
            proxy_pass http://hotel-api:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Soporte para WebSockets del Hotel (Dashboard)
        location /socket.io/ {
            proxy_pass http://hotel-api:3001/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }
}